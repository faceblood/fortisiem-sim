phases:
  recon_and_access:
    description: 'T1078 — Acceso inicial: fallos de login + VPN desde país externo'
    delay_before: 0.0
    events:
    - id: login_failed
      count: 12
      actor: ws_remote_vpn
      delay: 0.4
      jitter: 0.25
    - id: login_success
      count: 1
      actor: ws_remote_vpn
      delay: 1.0
    - id: vpn_login_foreign_country
      count: 2
      actor: ws_remote_vpn
      delay: 2.0
  execution:
    description: T1059 / T1003 — Ejecución y acceso a credenciales simulado
    delay_before: 3.0
    events:
    - id: ssh_login
      count: 2
      actor: ws_finance_01
      delay: 1.0
    - id: suspicious_powershell_simulated
      count: 4
      actor: ws_finance_01
      delay: 1.5
      jitter: 0.5
    - id: shadow_access_simulated
      count: 2
      actor: ws_finance_01
      delay: 2.0
    - id: credential_access_simulated
      count: 2
      actor: ws_finance_01
      delay: 2.0
    - id: process_execution
      count: 3
      actor: ws_finance_01
      delay: 0.8
  staging_and_exfil:
    description: T1560 / T1048 — Staging y conexiones salientes simuladas
    delay_before: 5.0
    events:
    - id: file_access_sensitive
      count: 5
      actor: ws_finance_01
      delay: 1.0
    - id: archive_creation
      count: 2
      actor: ws_finance_01
      delay: 2.0
    - id: outbound_connection
      count: 35
      actor: ws_remote_vpn
      delay: 0.2
      jitter: 0.1
    - id: web_upload
      count: 4
      actor: ws_remote_vpn
      delay: 1.0
  lateral_movement:
    description: T1021 — Movimiento lateral simulado hacia IT/DC
    delay_before: 8.0
    events:
    - id: lateral_movement_simulated
      count: 3
      actor: ws_remote_vpn
      delay: 3.0
    - id: backup_access
      count: 3
      actor: dc_lab_01
      delay: 1.5
    - id: sudo_command
      count: 2
      actor: ws_it_02
      delay: 1.0
  impact_identity:
    description: T1098 / T1486 — Escalada, nueva cuenta, impacto simulado
    delay_before: 10.0
    events:
    - id: new_user_created
      count: 1
      actor: ws_remote_vpn
    - id: privilege_change
      count: 1
      actor: ws_remote_vpn
    - id: defacement_simulated
      count: 1
      actor: ws_remote_vpn
