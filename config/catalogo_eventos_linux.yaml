catalogo_eventos_linux:
  metadata:
    nombre: "catalogo_eventos_linux"
    version: "1.0"
    uso: "Catálogo de eventos Linux para generación de logs sintéticos, normalización SIEM y correlación"
    campo_clasificacion: "legitimidad"
    valores_legitimidad:
      - "legit"
      - "non-legit"
    nota_seguridad: >
      Este catálogo describe eventos de sistema Linux en formato sintético.
      Los eventos marcados como non-legit representan señales defensivas o actividad sospechosa,
      no instrucciones operativas.

  variables_comunes:
    timestamp: "Jun 14 10:15:22"
    timestamp_iso: "2026-06-14 10:15:22"
    timestamp_nginx: "14/Jun/2026:10:15:22 +0200"
    timestamp_nginx_error: "2026/06/14 10:15:22"
    host: "srv-linux-01"
    user: "alice"
    admin_user: "admin"
    src_ip: "192.168.1.50"
    src_port: 52244
    dst_ip: "192.168.1.20"
    dst_port: 22
    tty: "pts/0"
    uid: 1001
    session_id: 42
    pid: 12345

  eventos:

    - id: "auth_ssh_login_success"
      nombre: "SSH login correcto"
      categoria: "autenticacion"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      ruta_linux:
        debian_ubuntu: "/var/log/auth.log"
        rhel_centos_fedora: "/var/log/secure"
      programa: "sshd"
      plantilla: "{{timestamp}} {{host}} sshd[{{pid}}]: Accepted publickey for {{user}} from {{src_ip}} port {{src_port}} ssh2"
      ejemplo: "Jun 14 10:15:22 srv-linux-01 sshd[12345]: Accepted publickey for alice from 192.168.1.50 port 52244 ssh2"
      campos:
        user: "{{user}}"
        src_ip: "{{src_ip}}"
        src_port: "{{src_port}}"
        auth_method: "publickey"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1021.004"
          - "T1078"
          - "T1078.003"
        razon: "Acceso remoto SSH usando una cuenta válida."

    - id: "auth_ssh_login_password_success"
      nombre: "SSH login correcto por contraseña"
      categoria: "autenticacion"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      ruta_linux:
        debian_ubuntu: "/var/log/auth.log"
        rhel_centos_fedora: "/var/log/secure"
      programa: "sshd"
      plantilla: "{{timestamp}} {{host}} sshd[{{pid}}]: Accepted password for {{user}} from {{src_ip}} port {{src_port}} ssh2"
      ejemplo: "Jun 14 10:16:11 srv-linux-01 sshd[12346]: Accepted password for alice from 192.168.1.50 port 52245 ssh2"
      campos:
        user: "{{user}}"
        src_ip: "{{src_ip}}"
        src_port: "{{src_port}}"
        auth_method: "password"
      mitre:
        relevancia: "contextual"
        tecnicas:
          - "T1021.004"
          - "T1078"
        razon: "Login SSH válido; puede ser normal o sospechoso según origen y baseline."

    - id: "auth_ssh_login_failed"
      nombre: "SSH login fallido"
      categoria: "autenticacion"
      legitimidad: "non-legit"
      severidad_sugerida: "medium"
      fuente: "auth.log"
      ruta_linux:
        debian_ubuntu: "/var/log/auth.log"
        rhel_centos_fedora: "/var/log/secure"
      programa: "sshd"
      plantilla: "{{timestamp}} {{host}} sshd[{{pid}}]: Failed password for {{user}} from {{src_ip}} port {{src_port}} ssh2"
      ejemplo: "Jun 14 10:17:02 srv-linux-01 sshd[12347]: Failed password for invaliduser from 203.0.113.10 port 51111 ssh2"
      campos:
        user: "{{user}}"
        src_ip: "{{src_ip}}"
        src_port: "{{src_port}}"
        auth_method: "password"
        result: "failure"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1110"
          - "T1021.004"
        razon: "Intento fallido de autenticación SSH; múltiples eventos pueden indicar fuerza bruta."

    - id: "auth_ssh_invalid_user"
      nombre: "SSH usuario inválido"
      categoria: "autenticacion"
      legitimidad: "non-legit"
      severidad_sugerida: "medium"
      fuente: "auth.log"
      programa: "sshd"
      plantilla: "{{timestamp}} {{host}} sshd[{{pid}}]: Invalid user {{user}} from {{src_ip}} port {{src_port}}"
      ejemplo: "Jun 14 10:17:10 srv-linux-01 sshd[12348]: Invalid user test from 203.0.113.10 port 51112"
      campos:
        user: "{{user}}"
        src_ip: "{{src_ip}}"
        src_port: "{{src_port}}"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1110"
          - "T1087"
        razon: "Enumeración o intento de autenticación con usuario inexistente."

    - id: "auth_ssh_session_opened"
      nombre: "Apertura de sesión SSH"
      categoria: "autenticacion"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "sshd"
      plantilla: "{{timestamp}} {{host}} sshd[{{pid}}]: pam_unix(sshd:session): session opened for user {{user}} by (uid=0)"
      ejemplo: "Jun 14 10:15:22 srv-linux-01 sshd[12345]: pam_unix(sshd:session): session opened for user alice by (uid=0)"
      campos:
        user: "{{user}}"
        pam_service: "sshd"
        session_state: "opened"
      mitre:
        relevancia: "contextual"
        tecnicas:
          - "T1021.004"
          - "T1078"
        razon: "Apertura de sesión tras autenticación remota."

    - id: "auth_ssh_session_closed"
      nombre: "Cierre de sesión SSH"
      categoria: "autenticacion"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "sshd"
      plantilla: "{{timestamp}} {{host}} sshd[{{pid}}]: pam_unix(sshd:session): session closed for user {{user}}"
      ejemplo: "Jun 14 10:42:08 srv-linux-01 sshd[12345]: pam_unix(sshd:session): session closed for user alice"
      campos:
        user: "{{user}}"
        pam_service: "sshd"
        session_state: "closed"
      mitre:
        relevancia: "baja_contextual"
        tecnicas:
          - "T1021.004"
        razon: "Cierre de sesión; útil para reconstrucción temporal."

    - id: "auth_sudo_command"
      nombre: "Comando ejecutado con sudo"
      categoria: "privilegios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "sudo"
      plantilla: "{{timestamp}} {{host}} sudo: {{user}} : TTY={{tty}} ; PWD={{pwd}} ; USER=root ; COMMAND={{command}}"
      ejemplo: "Jun 14 10:18:03 srv-linux-01 sudo: alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/usr/bin/systemctl status nginx"
      campos:
        user: "{{user}}"
        tty: "{{tty}}"
        pwd: "/home/{{user}}"
        run_as: "root"
        command: "{{command}}"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1548.003"
          - "T1059.004"
        razon: "Elevación de privilegios mediante sudo para ejecutar comandos."

    - id: "auth_sudo_session_opened"
      nombre: "Apertura de sesión sudo"
      categoria: "privilegios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "sudo"
      plantilla: "{{timestamp}} {{host}} sudo: pam_unix(sudo:session): session opened for user root by {{user}}(uid={{uid}})"
      ejemplo: "Jun 14 10:18:03 srv-linux-01 sudo: pam_unix(sudo:session): session opened for user root by alice(uid=1001)"
      campos:
        user: "{{user}}"
        target_user: "root"
        uid: "{{uid}}"
        session_state: "opened"
      mitre:
        relevancia: "contextual"
        tecnicas:
          - "T1548.003"
        razon: "Apertura de contexto privilegiado con sudo."

    - id: "auth_sudo_session_closed"
      nombre: "Cierre de sesión sudo"
      categoria: "privilegios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "sudo"
      plantilla: "{{timestamp}} {{host}} sudo: pam_unix(sudo:session): session closed for user root"
      ejemplo: "Jun 14 10:18:04 srv-linux-01 sudo: pam_unix(sudo:session): session closed for user root"
      campos:
        target_user: "root"
        session_state: "closed"
      mitre:
        relevancia: "baja_contextual"
        tecnicas:
          - "T1548.003"
        razon: "Cierre de contexto sudo."

    - id: "auth_sudo_auth_failure"
      nombre: "Fallo de autenticación sudo"
      categoria: "privilegios"
      legitimidad: "non-legit"
      severidad_sugerida: "medium"
      fuente: "auth.log"
      programa: "sudo"
      plantilla: "{{timestamp}} {{host}} sudo: pam_unix(sudo:auth): authentication failure; logname={{user}} uid={{uid}} euid=0 tty={{tty}} ruser={{user}} rhost= user={{user}}"
      ejemplo: "Jun 14 10:20:10 srv-linux-01 sudo: pam_unix(sudo:auth): authentication failure; logname=alice uid=1001 euid=0 tty=pts/0 ruser=alice rhost= user=alice"
      campos:
        user: "{{user}}"
        uid: "{{uid}}"
        tty: "{{tty}}"
        result: "failure"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1548.003"
        razon: "Intento fallido de elevación mediante sudo."

    - id: "auth_user_login_console"
      nombre: "Login local por consola"
      categoria: "autenticacion"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "login"
      plantilla: "{{timestamp}} {{host}} login[{{pid}}]: pam_unix(login:session): session opened for user {{user}} by LOGIN(uid=0)"
      ejemplo: "Jun 14 09:02:11 srv-linux-01 login[2188]: pam_unix(login:session): session opened for user alice by LOGIN(uid=0)"
      campos:
        user: "{{user}}"
        pam_service: "login"
        session_state: "opened"
      mitre:
        relevancia: "contextual"
        tecnicas:
          - "T1078"
          - "T1078.003"
        razon: "Uso de cuenta válida en consola local."

    - id: "auth_polkit_action"
      nombre: "Autorización polkit"
      categoria: "privilegios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "polkitd"
      plantilla: "{{timestamp}} {{host}} polkitd[{{pid}}]: Operator of unix-session:{{session_id}} successfully authenticated as unix-user:{{user}} to gain TEMPORARY authorization for action {{action}}"
      ejemplo: "Jun 14 10:20:44 srv-linux-01 polkitd[987]: Operator of unix-session:42 successfully authenticated as unix-user:alice to gain TEMPORARY authorization for action org.freedesktop.systemd1.manage-units"
      campos:
        user: "{{user}}"
        session_id: "{{session_id}}"
        action: "org.freedesktop.systemd1.manage-units"
      mitre:
        relevancia: "media_contextual"
        tecnicas:
          - "T1548"
        razon: "Autorización temporal para acción privilegiada."

    - id: "systemd_service_started"
      nombre: "Servicio iniciado"
      categoria: "servicios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "syslog"
      ruta_linux:
        debian_ubuntu: "/var/log/syslog"
        systemd_journal: "journalctl"
      programa: "systemd"
      plantilla: "{{timestamp}} {{host}} systemd[1]: Started {{service_description}}."
      ejemplo: "Jun 14 10:21:15 srv-linux-01 systemd[1]: Started A high performance web server and a reverse proxy server."
      campos:
        unit: "{{unit}}"
        service_description: "{{service_description}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1543.002"
        razon: "Inicio de servicio; relevante si el unit file es nuevo o modificado."

    - id: "systemd_service_stopped"
      nombre: "Servicio detenido"
      categoria: "servicios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "syslog"
      programa: "systemd"
      plantilla: "{{timestamp}} {{host}} systemd[1]: Stopped {{service_description}}."
      ejemplo: "Jun 14 10:35:09 srv-linux-01 systemd[1]: Stopped A high performance web server and a reverse proxy server."
      campos:
        unit: "{{unit}}"
        service_description: "{{service_description}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1543.002"
        razon: "Parada de servicio; puede ser sospechosa si afecta servicios de seguridad."

    - id: "systemd_service_reloaded"
      nombre: "Servicio recargado"
      categoria: "servicios"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "syslog"
      programa: "systemd"
      plantilla: "{{timestamp}} {{host}} systemd[1]: Reloaded {{service_description}}."
      ejemplo: "Jun 14 10:24:31 srv-linux-01 systemd[1]: Reloaded A high performance web server and a reverse proxy server."
      campos:
        unit: "{{unit}}"
        service_description: "{{service_description}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1543.002"
        razon: "Recarga de servicio tras cambios de configuración."

    - id: "systemd_security_service_stopped"
      nombre: "Servicio de seguridad detenido"
      categoria: "desactivacion_defensas"
      legitimidad: "non-legit"
      severidad_sugerida: "critical"
      fuente: "syslog"
      programa: "systemd"
      plantilla: "{{timestamp}} {{host}} systemd[1]: Stopped {{security_service_description}}."
      ejemplo: "Jun 14 11:01:10 srv-linux-01 systemd[1]: Stopped Security Auditing Service."
      campos:
        unit: "auditd.service"
        service_family: "security_logging"
      mitre:
        relevancia: "alta"
        tecnicas:
          - "T1562"
          - "T1562.012"
        razon: "Parada de servicio de auditoría, logging o seguridad."

    - id: "system_boot"
      nombre: "Arranque del sistema"
      categoria: "sistema"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "journal"
      programa: "kernel"
      plantilla: "{{timestamp}} {{host}} kernel: Linux version {{kernel_version}}"
      ejemplo: "Jun 14 08:00:01 srv-linux-01 kernel: Linux version 6.8.0-35-generic"
      campos:
        kernel_version: "{{kernel_version}}"
      mitre:
        relevancia: "contexto_operacional"
        tecnicas: []
        razon: "Evento operativo de arranque."

    - id: "system_shutdown"
      nombre: "Apagado del sistema"
      categoria: "sistema"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "syslog"
      programa: "systemd"
      plantilla: "{{timestamp}} {{host}} systemd[1]: Reached target System Shutdown."
      ejemplo: "Jun 14 22:15:00 srv-linux-01 systemd[1]: Reached target System Shutdown."
      campos:
        target: "System Shutdown"
      mitre:
        relevancia: "contexto_operacional"
        tecnicas: []
        razon: "Evento operativo de apagado."

    - id: "cron_job_started"
      nombre: "Tarea cron ejecutada"
      categoria: "tareas_programadas"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "syslog"
      programa: "CRON"
      plantilla: "{{timestamp}} {{host}} CRON[{{pid}}]: ({{user}}) CMD ({{command}})"
      ejemplo: "Jun 14 11:00:01 srv-linux-01 CRON[22341]: (root) CMD (/usr/local/bin/backup.sh)"
      campos:
        user: "{{user}}"
        command: "{{command}}"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1053.003"
          - "T1059.004"
        razon: "Ejecución de tarea programada."

    - id: "cron_session_opened"
      nombre: "Apertura de sesión cron"
      categoria: "tareas_programadas"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "CRON"
      plantilla: "{{timestamp}} {{host}} CRON[{{pid}}]: pam_unix(cron:session): session opened for user {{user}} by (uid=0)"
      ejemplo: "Jun 14 11:00:01 srv-linux-01 CRON[22341]: pam_unix(cron:session): session opened for user root by (uid=0)"
      campos:
        user: "{{user}}"
        pam_service: "cron"
        session_state: "opened"
      mitre:
        relevancia: "contextual"
        tecnicas:
          - "T1053.003"
        razon: "Apertura de sesión asociada a cron."

    - id: "cron_session_closed"
      nombre: "Cierre de sesión cron"
      categoria: "tareas_programadas"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "auth.log"
      programa: "CRON"
      plantilla: "{{timestamp}} {{host}} CRON[{{pid}}]: pam_unix(cron:session): session closed for user {{user}}"
      ejemplo: "Jun 14 11:00:05 srv-linux-01 CRON[22341]: pam_unix(cron:session): session closed for user root"
      campos:
        user: "{{user}}"
        pam_service: "cron"
        session_state: "closed"
      mitre:
        relevancia: "baja_contextual"
        tecnicas:
          - "T1053.003"
        razon: "Cierre de sesión asociada a cron."

    - id: "cron_suspicious_tmp_execution"
      nombre: "Cron ejecutando desde ruta temporal"
      categoria: "persistencia"
      legitimidad: "non-legit"
      severidad_sugerida: "critical"
      fuente: "syslog"
      programa: "CRON"
      plantilla: "{{timestamp}} {{host}} CRON[{{pid}}]: ({{user}}) CMD (/tmp/{{file}})"
      ejemplo: "Jun 14 11:10:01 srv-linux-01 CRON[22410]: (root) CMD (/tmp/task)"
      campos:
        user: "{{user}}"
        command_path: "/tmp/{{file}}"
      mitre:
        relevancia: "alta"
        tecnicas:
          - "T1053.003"
          - "T1059.004"
        razon: "Cron ejecutando binario o script desde ruta temporal."

    - id: "package_apt_update"
      nombre: "APT update"
      categoria: "paquetes"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "apt"
      ruta_linux:
        debian_ubuntu: "/var/log/apt/history.log"
      programa: "apt"
      plantilla: "Commandline: apt {{apt_action}}"
      ejemplo: "Commandline: apt update"
      campos:
        apt_action: "update"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1105"
        razon: "Descarga de índices; relevante si se usan repositorios no aprobados."

    - id: "package_apt_install"
      nombre: "APT install"
      categoria: "paquetes"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "apt"
      ruta_linux:
        debian_ubuntu: "/var/log/apt/history.log"
      programa: "apt"
      plantilla: "Install: {{package}}:{{arch}} ({{version}})"
      ejemplo: "Install: nginx:amd64 (1.24.0-2ubuntu7)"
      campos:
        package: "{{package}}"
        arch: "{{arch}}"
        version: "{{version}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1105"
        razon: "Instalación de paquete; puede ser sospechoso si el paquete no está aprobado."

    - id: "package_suspicious_tool_install"
      nombre: "Instalación de herramienta potencialmente sospechosa"
      categoria: "paquetes"
      legitimidad: "non-legit"
      severidad_sugerida: "high"
      fuente: "apt"
      programa: "apt"
      plantilla: "Commandline: apt install {{suspicious_package}}"
      ejemplo: "Commandline: apt install ncat"
      campos:
        package: "{{suspicious_package}}"
      mitre:
        relevancia: "alta_contextual"
        tecnicas:
          - "T1105"
          - "T1059.004"
        razon: "Instalación de herramienta que puede habilitar transferencia, túneles o ejecución remota."

    - id: "package_dpkg_install"
      nombre: "DPKG install"
      categoria: "paquetes"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "dpkg"
      ruta_linux:
        debian_ubuntu: "/var/log/dpkg.log"
      programa: "dpkg"
      plantilla: "{{timestamp_iso}} install {{package}}:{{arch}} {{old_version}} {{new_version}}"
      ejemplo: "2026-06-14 10:28:02 install nginx:amd64 <none> 1.24.0-2ubuntu7"
      campos:
        package: "{{package}}"
        arch: "{{arch}}"
        old_version: "{{old_version}}"
        new_version: "{{new_version}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1105"
        razon: "Instalación local de paquete."

    - id: "package_yum_install"
      nombre: "YUM install"
      categoria: "paquetes"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "yum"
      ruta_linux:
        rhel_centos: "/var/log/yum.log"
      programa: "yum"
      plantilla: "{{timestamp}} Installed: {{package}}"
      ejemplo: "Jun 14 10:29:33 Installed: nginx.x86_64 1:1.24.0-1.el9"
      campos:
        package: "{{package}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1105"
        razon: "Instalación de paquete con yum."

    - id: "package_dnf_install"
      nombre: "DNF install"
      categoria: "paquetes"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "dnf"
      ruta_linux:
        fedora_rhel: "/var/log/dnf.log"
      programa: "dnf"
      plantilla: "{{timestamp}} INFO Installed: {{package}}"
      ejemplo: "Jun 14 10:29:33 INFO Installed: nginx-1:1.24.0-1.el9.x86_64"
      campos:
        package: "{{package}}"
      mitre:
        relevancia: "condicional"
        tecnicas:
          - "T1105"
        razon: "Instalación de paquete con dnf."

    - id: "network_interface_up"
      nombre: "Interfaz de red activada"
      categoria: "red"
      legitimidad: "legit"
      severidad_sugerida: "info"
      fuente: "syslog"
      programa: "NetworkManager"
      plantilla: "{{timestamp}} {{host}} NetworkManager[{{pid}}]: <info>  [{{epoch}}] device ({{interface}}): state change: disconnected -> activated"
      ejemplo: "Jun 14 08:00:12 srv-linux-01 NetworkManager[801]: <info>  [1781416812.1234] device (ens33): state change: disconnected -> activated"
      campos:
        interface: "{{interface}}"
        old_state: "disconnected"
        new_state: "activated"
      mitre:
